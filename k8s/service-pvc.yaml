---
apiVersion: v1
kind: Service
metadata:
  name: mx-ui
  namespace: mx-ui
  labels:
    app: mx-ui
spec:
  type: LoadBalancer
  selector:
    app: mx-ui
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-ui-pvc
  namespace: mx-ui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mx-ui-hpa
  namespace: mx-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mx-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
