apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-ui
  namespace: mx-ui
  labels:
    app: mx-ui
spec:
  # Xray state and WebSocket sessions are local to one pod. Two replicas
  # behind one service split sessions and can race on the shared state volume.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mx-ui
  template:
    metadata:
      labels:
        app: mx-ui
    spec:
      containers:
      - name: mx-ui
        image: mx-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: internal
          containerPort: 8001
          protocol: TCP
        envFrom:
        - configMapRef:
            name: mx-ui-config
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: xray-config
          mountPath: /etc/xray
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mx-ui-pvc
      - name: xray-config
        configMap:
          name: xray-config
          optional: true
