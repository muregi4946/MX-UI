# docker-compose.yml — برای اجرای لوکال (نه Railway)
# Railway مستقیم از Dockerfile استفاده می‌کنه
version: '3.8'

services:
  mx-ui:
    build: .
    container_name: mx-ui
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=${TZ:-Asia/Tehran}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
